<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroVerídico - Checagem de Fatos do Agro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
    <h1>🌱 AgroVerídico</h1>
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Digite um boato (ex: descarte de tomate)...">
        <button onclick="buscarChecagem()">Checar</button>
    </div>

    <div id="resultBox" class="result">
        <span id="badge" class="badge"></span>
        <h3 id="resultTitle"></h3>
        <p id="resultText"></p>
        <p class="fonte" id="resultFonte"></p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
